<style>
/* ==== ANASAYFA ==== */

/* HERO */
.home-hero {
  min-height: 80vh;
  display: grid; grid-template-columns: 1fr 1fr; align-items: center;
  padding: 80px 48px 80px; gap: 60px; position: relative;
  background: var(--milk);
}
.hero-eyebrow {
  font-family: 'Quicksand', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 24px;
  display: inline-flex; align-items: center; gap: 12px;
}
.hero-eyebrow::before {
  content: ''; width: 28px; height: 2px; background: var(--orange);
  border-radius: 2px;
}
.home-hero h1 {
  font-size: clamp(44px, 5.4vw, 80px); line-height: 1.08; color: var(--ink);
  margin: 0 0 32px; font-weight: 700;
}
.home-hero h1 em {
  color: var(--teal-deep); font-style: normal;
  font-family: 'Caveat', cursive; font-weight: 700;
  font-size: 1.05em;
  line-height: 0.9;
  display: inline-block;
}
.home-hero h1 .accent {
  color: var(--orange); font-style: normal;
}
.hero-sub {
  font-size: 18px; color: var(--ink-soft); max-width: 480px;
  margin-bottom: 36px; line-height: 1.6; font-weight: 500;
}
.hero-actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.btn .arrow { transition: transform .3s; display: inline-block; }
.btn:hover .arrow { transform: translateX(4px); }

.home-hero-visual { position: relative; height: 70vh; min-height: 540px; }
.hero-img-main {
  position: absolute; top: 0; right: 0; width: 78%; height: 88%;
  border-radius: 24px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(14,132,120,0.18);
  background: var(--cream-deep);
  border: 4px solid white;
}
.hero-img-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-img-caption {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  background: linear-gradient(to top, rgba(14,132,120,0.85) 0%, rgba(14,132,120,0.4) 60%, rgba(14,132,120,0) 100%);
  padding: 48px 22px 20px; color: white;
}
.cap-mono {
  font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.85); margin-bottom: 4px;
}
.cap-name { font-family: 'Quicksand', sans-serif; font-size: 19px; font-weight: 700; color: white; }

.hero-img-accent {
  position: absolute; bottom: 0; left: 0; width: 36%; aspect-ratio: 1;
  border-radius: 16px; overflow: hidden; z-index: 2;
  box-shadow: 0 16px 40px rgba(14,132,120,0.18);
  border: 4px solid white;
}
.hero-badge {
  position: absolute; top: 16px; right: -12px; z-index: 10;
  background: var(--orange); color: white;
  padding: 12px 18px; border-radius: 999px;
  font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px;
  box-shadow: 0 8px 20px rgba(243,146,51,0.28);
  display: inline-flex; align-items: center; gap: 10px;
  transform: rotate(-3deg);
  white-space: nowrap;
}
.hero-badge .dot { width: 8px; height: 8px; background: white; border-radius: 50%; }

.blob { position: absolute; pointer-events: none; z-index: 0; }

/* MARQUEE */
.home-marquee {
  background: var(--teal-deep); color: white;
  padding: 22px 0; overflow: hidden;
}
.home-marquee-track {
  display: flex; gap: 60px; white-space: nowrap;
  animation: hm-scroll 38s linear infinite;
  font-family: 'Quicksand', sans-serif; font-size: 24px;
  font-weight: 700;
}
.home-marquee-track span { display: inline-flex; align-items: center; gap: 60px; }
.home-marquee-track span::after {
  content: '✿'; color: var(--sun); font-size: 18px;
}
.home-marquee-track span:nth-child(5n+1)::after { color: var(--sun); }
.home-marquee-track span:nth-child(5n+2)::after { color: var(--orange); content: '★'; }
.home-marquee-track span:nth-child(5n+3)::after { color: var(--rose); content: '♥'; }
.home-marquee-track span:nth-child(5n+4)::after { color: var(--grass); content: '✿'; }
.home-marquee-track span:nth-child(5n+5)::after { color: var(--grape); content: '✦'; }
@keyframes hm-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-33.3333%); }
}

/* MAMINO BLOCK */
.mamino-block {
  background: var(--paper);
  padding: 130px 48px;
  position: relative;
}
.mamino-inner { max-width: 1280px; margin: 0 auto; }
.mamino-head { text-align: center; max-width: 760px; margin: 0 auto 70px; }
.mamino-head h2 {
  font-size: clamp(48px, 5.5vw, 84px); line-height: 1.05; margin-bottom: 24px;
  letter-spacing: 0.04em;
}
.mamino-head h2 .handwritten { display: block; margin-bottom: 8px; letter-spacing: 0; font-weight: 700; }
.mamino-story {
  font-size: 17px; color: var(--ink-soft); line-height: 1.7;
  font-weight: 500;
}
.mamino-story em { color: var(--orange); font-style: normal; font-weight: 700; font-family: 'Caveat', cursive; font-size: 1.4em; }
.mamino-story strong { color: var(--ink); font-weight: 700; }

.mamino-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px;
}
.mamino-card {
  background: white; border-radius: 18px; padding: 28px 20px;
  border: 2px solid var(--line);
  transition: transform .3s, box-shadow .3s;
  position: relative; text-align: left;
}
.mamino-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
.mamino-letter {
  font-size: 64px; font-weight: 700; line-height: 1;
  margin-bottom: 12px; letter-spacing: -0.04em;
}
.mamino-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.mamino-card p { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 0; font-weight: 500; }

.mamino-sun    { background: var(--sun-soft); border-color: var(--sun); }
.mamino-sun .mamino-letter { color: #b58e00; }
.mamino-orange { background: var(--orange-soft); border-color: var(--orange); }
.mamino-orange .mamino-letter { color: var(--orange); }
.mamino-rose   { background: var(--rose-soft); border-color: var(--rose); }
.mamino-rose .mamino-letter { color: #c84979; }
.mamino-grass  { background: var(--grass-soft); border-color: var(--grass); }
.mamino-grass .mamino-letter { color: #4d8a26; }
.mamino-sky    { background: var(--sky-soft); border-color: var(--sky); }
.mamino-sky .mamino-letter { color: #2d8eb8; }
.mamino-grape  { background: var(--grape-soft); border-color: var(--grape); }
.mamino-grape .mamino-letter { color: var(--grape); }

/* HERITAGE */
.heritage {
  background: var(--milk);
  padding: 130px 48px;
}
.heritage-inner {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 70px; align-items: center;
}
.heritage-text h2 { font-size: clamp(40px, 4.4vw, 64px); line-height: 1.05; margin-bottom: 24px; }
.heritage-text h2 em { color: var(--teal-deep); font-style: normal; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.1em; }
.heritage-text p { font-size: 16px; line-height: 1.7; color: var(--ink-soft); margin: 0 0 18px; font-weight: 500; }
.heritage-text strong { color: var(--ink); font-weight: 700; }
.heritage-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.stat-card {
  border-radius: 20px; padding: 32px 24px; color: white;
  position: relative; overflow: hidden;
  transform: rotate(var(--tilt, 0deg));
  transition: transform .3s;
}
.stat-card:hover { transform: rotate(0deg) translateY(-4px); }
.stat-card:nth-child(1) { --tilt: -1.5deg; }
.stat-card:nth-child(2) { --tilt: 1.5deg; }
.stat-card:nth-child(3) { --tilt: 1deg; }
.stat-card:nth-child(4) { --tilt: -1deg; }
.stat-num { font-size: 64px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
.stat-num span { font-size: 22px; font-weight: 600; opacity: 0.9; margin-left: 4px; }
.stat-label { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.95; }
.stat-teal   { background: var(--teal); }
.stat-orange { background: var(--orange); }
.stat-grass  { background: var(--grass); }
.stat-rose   { background: var(--rose); }

/* REASONS */
.reasons {
  background: var(--paper);
  padding: 130px 48px;
}
.reasons-inner { max-width: 1200px; margin: 0 auto; }
.reasons-head { text-align: center; max-width: 720px; margin: 0 auto 60px; }
.reasons-head h2 { font-size: clamp(40px, 4.4vw, 64px); line-height: 1.05; }
.reasons-head .handwritten { color: var(--rose); }
.reasons-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px 60px;
}
.reason {
  display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: start;
}
.reason h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
.reason p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); margin: 0; font-weight: 500; }

/* PROGRAMS */
.programs {
  background: var(--sand);
  padding: 130px 48px;
}
.programs-inner { max-width: 1280px; margin: 0 auto; }
.programs-head { max-width: 720px; margin-bottom: 56px; }
.programs-head h2 { font-size: clamp(40px, 4.4vw, 64px); line-height: 1.05; margin-bottom: 14px; }
.programs-head h2 em { color: var(--orange); font-style: normal; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.1em; }
.programs-head .lede { font-size: 17px; color: var(--ink-soft); line-height: 1.6; font-weight: 500; }
.programs-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
}
.prog-card {
  background: white; border-radius: 20px; padding: 32px 28px;
  border: 2px solid transparent;
  transition: transform .3s, box-shadow .3s;
}
.prog-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
.prog-card .prog-ic {
  width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px; color: white;
}
.prog-card h3 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.prog-card p { font-size: 14px; color: var(--ink-soft); margin: 0; font-weight: 500; }
.prog-orange .prog-ic { background: var(--orange); }
.prog-orange { border-color: var(--orange-soft); }
.prog-teal .prog-ic { background: var(--teal); }
.prog-teal { border-color: var(--teal-soft); }
.prog-grass .prog-ic { background: var(--grass); }
.prog-grass { border-color: var(--grass-soft); }
.prog-sky .prog-ic { background: var(--sky); }
.prog-sky { border-color: var(--sky-soft); }
.prog-rose .prog-ic { background: var(--rose); }
.prog-rose { border-color: var(--rose-soft); }
.prog-sun .prog-ic { background: var(--sun); color: var(--ink); }
.prog-sun { border-color: var(--sun-soft); }

/* GARDEN STRIP */
.garden-strip {
  padding: 110px 48px;
  background: var(--milk);
}
.garden-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1.3fr 0.8fr 0.8fr;
  gap: 18px; align-items: stretch;
}
.garden-text {
  padding: 20px 12px;
}
.garden-text h2 { font-size: clamp(32px, 3.4vw, 48px); line-height: 1.08; margin-bottom: 16px; }
.garden-text h2 em { color: var(--grass); font-style: normal; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.1em; }
.garden-text p { font-size: 15px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 18px; font-weight: 500; }

/* QUOTE */
.home-quote {
  padding: 140px 48px; text-align: center;
  position: relative;
  background: var(--paper);
}
.home-quote blockquote {
  font-family: 'Quicksand', sans-serif; font-weight: 700;
  font-size: clamp(28px, 3.2vw, 44px); line-height: 1.3;
  letter-spacing: -0.01em; max-width: 920px; margin: 0 auto 24px;
  color: var(--ink);
}
.home-quote blockquote em {
  color: var(--teal-deep); font-style: normal;
  font-family: 'Caveat', cursive; font-size: 1.2em;
}
.home-quote .cite {
  font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-light);
}

/* GALLERY */
.gallery-strip {
  background: var(--sand);
  padding: 130px 0;
}
.gallery-head {
  max-width: 1280px; margin: 0 auto 50px; padding: 0 48px;
  display: flex; justify-content: space-between; align-items: end; gap: 40px;
}
.gallery-head h2 { font-size: clamp(36px, 4vw, 56px); line-height: 1.05; }
.gallery-grid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px;
  padding: 0 48px; max-width: 1280px; margin: 0 auto;
}

/* CTA */
.home-cta {
  background: var(--teal-deep); color: white;
  padding: 130px 48px;
  position: relative;
  overflow: hidden;
}
.home-cta::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 200px; height: 200px; border-radius: 50%;
  background: var(--orange); opacity: 0.4;
}
.home-cta::after {
  content: ''; position: absolute; bottom: -60px; left: -60px;
  width: 240px; height: 240px; border-radius: 50%;
  background: var(--rose); opacity: 0.3;
}
.cta-inner { max-width: 880px; margin: 0 auto; text-align: center; position: relative; z-index: 2; }
.cta-inner h2 {
  font-size: clamp(40px, 4.8vw, 64px); line-height: 1.05;
  margin: 0 0 20px; color: white;
}
.cta-inner h2 em { color: var(--sun); font-style: normal; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.15em; }
.cta-inner p {
  color: rgba(255,255,255,0.85); font-size: 17px;
  max-width: 540px; margin: 0 auto 32px; font-weight: 500;
}
.cta-actions { display: inline-flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }

/* RESPONSIVE */
@media (max-width: 1100px) {
  .home-hero { grid-template-columns: 1fr; padding: 60px 24px; gap: 48px; }
  .home-hero-visual { height: 60vh; min-height: 420px; }
  .hero-badge { right: 8px; top: 12px; transform: rotate(-2deg) scale(0.9); padding: 10px 14px; font-size: 12px; }
  .heritage-inner { grid-template-columns: 1fr; gap: 40px; }
  .mamino-grid { grid-template-columns: repeat(3, 1fr); }
  .reasons-grid { grid-template-columns: 1fr; gap: 24px; }
  .programs-grid { grid-template-columns: repeat(2, 1fr); }
  .garden-grid { grid-template-columns: 1fr 1fr; }
  .gallery-head { flex-direction: column; align-items: start; }
  .gallery-grid > div { grid-column: span 6 !important; aspect-ratio: 1 !important; }
  .home-quote, .home-cta, .reasons, .programs, .heritage, .mamino-block, .garden-strip { padding: 70px 24px; }
  .home-marquee-track { font-size: 18px; }
}
@media (max-width: 640px) {
  .mamino-grid { grid-template-columns: repeat(2, 1fr); }
  .programs-grid { grid-template-columns: 1fr; }
  .heritage-stats { grid-template-columns: 1fr 1fr; }
  .garden-grid { grid-template-columns: 1fr; }
  .hero-palette { display: none; }
  .hero-badge { right: 6px; top: 10px; padding: 8px 12px; font-size: 11px; transform: rotate(-2deg) scale(0.85); }
}

/* MAMINO CARDS (Mavi · Mine ikili kart) */
.mamino-cards {
  display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  max-width: 1080px; margin: 0 auto;
}
.mamino-side {
  background: white; border-radius: 28px; padding: 40px 36px;
  box-shadow: 0 8px 32px rgba(14,132,120,0.08);
  border: 2px dashed transparent;
  transition: all 0.3s;
  display: flex; flex-direction: column; gap: 14px;
}
.mamino-side:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(14,132,120,0.14); }
.mavi-side:hover { border-color: var(--teal-soft); }
.mine-side:hover { border-color: var(--orange-soft); }
.mamino-side-label { font-size: 32px; font-weight: 700; line-height: 1; }
.mamino-side p {
  font-size: 16px; line-height: 1.7; color: var(--ink-soft);
  font-weight: 500; margin: 0;
}
.mamino-side p em { font-style: italic; color: var(--ink); }
.mamino-mini-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-top: 8px; padding-top: 18px; border-top: 1px dashed var(--line);
}
.mamino-mini { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mamino-mini .smile-circle { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.mamino-mini-w { font-size: 12px; font-weight: 700; color: var(--ink); text-align: center; }

.mamino-footer {
  margin-top: 60px; text-align: center;
  padding-top: 50px; border-top: 2px dashed var(--line-deep);
  max-width: 760px; margin-left: auto; margin-right: auto;
}
.mamino-footer blockquote {
  font-family: 'Caveat', cursive;
  font-size: clamp(26px, 3.4vw, 42px);
  line-height: 1.3; color: var(--ink); font-weight: 700;
  margin: 0 0 28px;
}
.mamino-footer blockquote em { font-style: normal; font-size: 1.15em; }

/* PROFILE PREVIEW */
.profile-preview {
  background: var(--sand);
  padding: 130px 48px;
  position: relative;
  overflow: hidden;
}
.profile-preview-inner {
  max-width: 1180px; margin: 0 auto; position: relative; z-index: 2;
}
.profile-preview-head {
  text-align: center; max-width: 720px; margin: 0 auto 56px;
}
.profile-preview-head h2 {
  font-size: clamp(36px, 4.4vw, 60px); line-height: 1.05; margin: 8px 0 20px;
}
.profile-preview-head h2 em {
  font-style: normal; font-family: 'Caveat', cursive; font-weight: 700;
  color: var(--rose); font-size: 1.05em;
}
.profile-preview-lede {
  font-size: 17px; color: var(--ink-soft); line-height: 1.7;
  font-weight: 500;
}
.profile-preview-lede strong { color: var(--ink); }
.profile-preview-lede em { font-style: italic; color: var(--teal-deep); }
.profile-preview-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
}
.profile-preview-card {
  background: white; border-radius: 24px; padding: 28px 24px;
  box-shadow: 0 4px 16px rgba(14,132,120,0.08);
  display: flex; flex-direction: column; gap: 10px;
  transition: all 0.3s;
}
.profile-preview-card:hover {
  transform: translateY(-4px); box-shadow: 0 12px 32px rgba(14,132,120,0.14);
}
.profile-preview-emoji { font-size: 38px; line-height: 1; }
.profile-preview-card h3 { font-size: 19px; font-weight: 700; color: var(--ink); }
.profile-preview-card p {
  font-size: 14px; color: var(--ink-soft); line-height: 1.6;
  margin: 0; font-weight: 500;
}

@media (max-width: 1100px) {
  .mamino-cards { grid-template-columns: 1fr; }
  .profile-preview-grid { grid-template-columns: repeat(2, 1fr); }
  .profile-preview { padding: 70px 24px; }
}
@media (max-width: 640px) {
  .profile-preview-grid { grid-template-columns: 1fr; }
  .mamino-mini-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
}
</style>
