      "acceptedAnswer": {
        "@type": "Answer",
        "text": "2-6 yaş arası çocukları kabul ediyoruz. Üç yaş grubumuz var: 2 yaş (Minik Afacanlar), 3-4 yaş (Meraklı Minikler) ve 5-6 yaş (Gülen Yüzler). Her grup için ayrı sınıf ve özel program."
