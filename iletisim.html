<style>
/* ==== İLETİŞİM ==== */

/* HERO */
.iletisim-hero {
  position: relative;
  padding: 80px 48px 60px;
  background: var(--milk);
  text-align: center;
  overflow: hidden;
}
.iletisim-hero-inner {
  max-width: 760px; margin: 0 auto;
  position: relative; z-index: 2;
}
.iletisim-hero h1 {
  font-size: clamp(40px, 5.5vw, 76px); line-height: 1.05;
  margin: 18px 0 20px; font-weight: 700;
}
.iletisim-hero h1 em {
  color: var(--orange); font-style: normal;
  font-family: 'Caveat', cursive; font-weight: 700;
  font-size: 1.15em;
}
.iletisim-hero-lede {
  font-size: 18px; color: var(--ink-soft); line-height: 1.65;
  font-weight: 500; max-width: 560px; margin: 0 auto;
}
.iletisim-hero-lede strong { color: var(--ink); }

/* ANA İLETİŞİM KARTLARI */
.contact-cards {
  background: var(--paper);
  padding: 100px 48px 60px;
  position: relative;
}
.contact-cards-inner {
  max-width: 1180px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
}
.contact-card {
  background: white; border-radius: 24px;
  padding: 36px 28px; text-align: center;
  border: 2px solid var(--line);
  text-decoration: none; color: inherit;
  transition: all 0.3s; display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  position: relative; overflow: hidden;
}
.contact-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(14,132,120,0.14);
  border-color: var(--line-deep);
}
.contact-card .icon-circle {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.contact-card.tel .icon-circle { background: var(--teal); color: white; }
.contact-card.tel:hover { border-color: var(--teal); }
.contact-card.mail .icon-circle { background: var(--orange); color: white; }
.contact-card.mail:hover { border-color: var(--orange); }
.contact-card.adres .icon-circle { background: var(--rose); color: white; }
.contact-card.adres:hover { border-color: var(--rose); }

.contact-card .label {
  font-family: 'Quicksand', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-light);
}
.contact-card .value {
  font-family: 'Quicksand', sans-serif;
  font-size: 18px; font-weight: 700;
  color: var(--ink); line-height: 1.4;
  letter-spacing: -0.01em;
}
.contact-card .sub {
  font-size: 13.5px; color: var(--ink-soft);
  line-height: 1.55; font-weight: 500;
  margin-top: -4px;
}
.contact-card .arrow-link {
  font-family: 'Quicksand', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 6px;
}
.contact-card.tel .arrow-link { color: var(--teal-deep); }
.contact-card.mail .arrow-link { color: var(--orange); }
.contact-card.adres .arrow-link { color: #b13a64; }

/* SOSYAL MEDYA */
.social-section {
  background: var(--sand);
  padding: 100px 48px;
  position: relative;
}
.social-inner {
  max-width: 1180px; margin: 0 auto;
}
.social-head {
  text-align: center; max-width: 560px; margin: 0 auto 48px;
}
.social-head h2 {
  font-size: clamp(36px, 4.4vw, 54px); line-height: 1.05;
  margin: 8px 0 16px; font-weight: 700;
}
.social-head h2 em {
  color: var(--grape); font-style: normal;
  font-family: 'Caveat', cursive; font-size: 1.1em; font-weight: 700;
}
.social-head p {
  font-size: 16px; color: var(--ink-soft); line-height: 1.6;
  font-weight: 500;
}
.social-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  max-width: 760px; margin: 0 auto;
}
.social-card {
  border-radius: 24px; padding: 32px 28px;
  text-decoration: none; color: white;
  display: flex; flex-direction: column; gap: 12px;
  transition: all 0.3s; position: relative; overflow: hidden;
  min-height: 200px;
}
.social-card:hover {
  transform: translateY(-6px) rotate(-1deg);
  box-shadow: 0 20px 50px rgba(0,0,0,0.18);
}
.social-card.instagram {
  background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
}
.social-card.tiktok {
  background: linear-gradient(135deg, #000000 0%, #25F4EE 50%, #FE2C55 100%);
  background-color: #000;
}
.social-card .social-icon {
  width: 56px; height: 56px; border-radius: 16px;
  background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.social-card .social-handle {
  font-family: 'Quicksand', sans-serif;
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.01em;
}
.social-card .social-platform {
  font-family: 'Quicksand', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  opacity: 0.85;
}
.social-card .social-cta {
  margin-top: auto;
  font-family: 'Quicksand', sans-serif;
  font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
}

/* HARİTA */
.map-section {
  background: var(--paper);
  padding: 100px 48px;
}
.map-inner {
  max-width: 1180px; margin: 0 auto;
}
.map-head {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 60px; align-items: center; margin-bottom: 40px;
}
.map-head-text h2 {
  font-size: clamp(36px, 4.4vw, 54px); line-height: 1.05;
  margin: 8px 0 16px;
}
.map-head-text h2 em {
  color: var(--teal-deep); font-style: normal;
  font-family: 'Caveat', cursive; font-size: 1.1em; font-weight: 700;
}
.map-head-text p {
  font-size: 16px; color: var(--ink-soft); line-height: 1.65;
  font-weight: 500;
}
.map-head-text .adres-detay {
  margin-top: 18px; padding: 18px 22px;
  background: var(--milk); border-radius: 14px;
  border-left: 4px solid var(--rose);
}
.map-head-text .adres-detay strong {
  display: block; color: var(--ink); margin-bottom: 4px;
  font-size: 15px;
}
.map-head-text .adres-detay span {
  font-size: 14px; color: var(--ink-soft);
  line-height: 1.5;
}
.map-frame {
  border-radius: 24px; overflow: hidden;
  border: 4px solid white;
  box-shadow: 0 16px 40px rgba(14,132,120,0.18);
  aspect-ratio: 4/3;
  background: var(--cream-deep);
}
.map-frame iframe {
  width: 100%; height: 100%;
  border: 0; display: block;
}

/* SAATLER */
.hours-section {
  background: var(--milk);
  padding: 100px 48px;
}
.hours-inner {
  max-width: 880px; margin: 0 auto; text-align: center;
}
.hours-head h2 {
  font-size: clamp(32px, 3.8vw, 48px); line-height: 1.1;
  margin: 8px 0 16px; font-weight: 700;
}
.hours-head h2 em {
  color: var(--orange); font-style: normal;
  font-family: 'Caveat', cursive; font-size: 1.1em; font-weight: 700;
}
.hours-head p {
  font-size: 16px; color: var(--ink-soft); line-height: 1.6;
  font-weight: 500; max-width: 560px; margin: 0 auto 36px;
}
.hours-card {
  background: white; border-radius: 24px;
  padding: 36px 32px; border: 2px dashed var(--line-deep);
  display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  text-align: left;
}
.hours-block {
  display: flex; flex-direction: column; gap: 8px;
}
.hours-block .label {
  font-family: 'Quicksand', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-light);
}
.hours-block .time {
  font-family: 'Quicksand', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--ink); letter-spacing: -0.01em;
}
.hours-block .desc {
  font-size: 14px; color: var(--ink-soft); line-height: 1.55;
}
.hours-block-l { border-right: 2px dashed var(--line); padding-right: 28px; }

/* CTA — formlara yönlendirme */
.iletisim-cta {
  background: var(--teal-deep); color: white;
  padding: 100px 48px; position: relative; overflow: hidden;
}
.iletisim-cta::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 200px; height: 200px; border-radius: 50%;
  background: var(--orange); opacity: 0.4;
}
.iletisim-cta::after {
  content: ''; position: absolute; bottom: -60px; left: -60px;
  width: 240px; height: 240px; border-radius: 50%;
  background: var(--rose); opacity: 0.3;
}
.iletisim-cta-inner {
  max-width: 920px; margin: 0 auto;
  text-align: center; position: relative; z-index: 2;
}
.iletisim-cta h2 {
  font-size: clamp(36px, 4.4vw, 56px); line-height: 1.05;
  margin: 12px 0 18px; color: white;
}
.iletisim-cta h2 em {
  color: var(--sun); font-style: normal;
  font-family: 'Caveat', cursive; font-size: 1.15em; font-weight: 700;
}
.iletisim-cta-lede {
  color: rgba(255,255,255,0.85); font-size: 16px;
  max-width: 560px; margin: 0 auto 36px; font-weight: 500;
  line-height: 1.7;
}
.cta-form-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  max-width: 720px; margin: 0 auto;
}
.cta-form-card {
  background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 18px; padding: 24px 20px;
  text-align: left; text-decoration: none; color: white;
  transition: all 0.3s; display: flex; flex-direction: column; gap: 8px;
}
.cta-form-card:hover {
  background: rgba(255,255,255,0.18);
  border-color: white; transform: translateY(-4px);
}
.cta-form-card .form-time {
  font-family: 'Quicksand', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--sun);
}
.cta-form-card h3 {
  font-family: 'Quicksand', sans-serif;
  font-size: 18px; font-weight: 700; color: white;
  letter-spacing: -0.01em;
}
.cta-form-card p {
  font-size: 13px; color: rgba(255,255,255,0.78);
  line-height: 1.5; font-weight: 500; margin: 0;
}
.cta-form-card .arrow {
  margin-top: auto; font-size: 13px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
  .iletisim-hero, .contact-cards, .social-section, .map-section, .hours-section, .iletisim-cta {
    padding: 70px 24px;
  }
  .contact-cards-inner { grid-template-columns: 1fr; gap: 18px; }
  .map-head { grid-template-columns: 1fr; gap: 32px; }
  .cta-form-grid { grid-template-columns: 1fr; gap: 14px; max-width: 480px; }
}
@media (max-width: 640px) {
  .social-grid { grid-template-columns: 1fr; }
  .hours-card { grid-template-columns: 1fr; gap: 22px; }
  .hours-block-l { border-right: 0; border-bottom: 2px dashed var(--line); padding-right: 0; padding-bottom: 22px; }
}
</style>
