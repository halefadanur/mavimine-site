<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Quicksand, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#FFF7E8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12967F"/>
      <stop offset="1" stop-color="#0E8478"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- soft blobs -->
  <circle cx="1080" cy="70" r="140" fill="#F39233" opacity="0.10"/>
  <circle cx="110" cy="530" r="130" fill="#0E8478" opacity="0.09"/>

  <!-- eyebrow -->
  <text x="72" y="132" font-size="24" letter-spacing="4" font-weight="700" fill="#0E8478">KAYIT REHBERİ · 2026-2027</text>

  <!-- title -->
  <text x="70" y="204" font-size="58" font-weight="700" fill="#243B45">Çocuğum bu yıl</text>
  <!-- scribble underline flourish -->
  <path d="M74 224 C 180 208, 300 240, 412 220" stroke="#F39233" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
  <text x="70" y="292" font-size="66" font-weight="700" fill="#0E8478">Mavi Mine'ye</text>
  <text x="70" y="366" font-size="56" font-weight="700" fill="#243B45">kaydolabilir mi?</text>

  <!-- handwritten accent (kısa, tek satır, çakışmıyor) -->
  <text x="76" y="440" font-size="34" fill="#F39233" font-family="Caveat, 'Comic Sans MS', cursive">doğum ayına göre, adım adım bakalım</text>

  <!-- Calendar 30 Eylül badge -->
  <g transform="translate(858,120)">
    <rect x="0" y="0" width="230" height="240" rx="26" fill="#ffffff" stroke="#0E8478" stroke-width="3"/>
    <rect x="0" y="0" width="230" height="64" rx="26" fill="url(#teal)"/>
    <rect x="0" y="38" width="230" height="26" fill="url(#teal)"/>
    <circle cx="56" cy="6" r="10" fill="#F39233"/>
    <circle cx="174" cy="6" r="10" fill="#F39233"/>
    <text x="115" y="42" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">ESAS TARİH</text>
    <text x="115" y="158" font-size="92" font-weight="700" fill="#0E8478" text-anchor="middle">30</text>
    <text x="115" y="202" font-size="32" font-weight="700" fill="#F39233" text-anchor="middle">Eylül 2026</text>
  </g>

  <!-- three age-group smile circles (sağ alt, takvim altında, metinden uzak) -->
  <g transform="translate(806,478)">
    <!-- Minik Afacanlar - rose -->
    <circle cx="0" cy="0" r="42" fill="#EE7DA0"/>
    <circle cx="-13" cy="-6" r="5" fill="#fff"/>
    <circle cx="13" cy="-6" r="5" fill="#fff"/>
    <path d="M-16 10 Q 0 28 16 10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="0" y="72" font-size="18" font-weight="700" fill="#243B45" text-anchor="middle">2 yaş</text>

    <!-- Meraklı Minikler - sun -->
    <circle cx="118" cy="0" r="42" fill="#F7C244"/>
    <circle cx="105" cy="-6" r="5" fill="#5a4a1e"/>
    <circle cx="131" cy="-6" r="5" fill="#5a4a1e"/>
    <path d="M102 10 Q 118 28 134 10" stroke="#5a4a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="118" y="72" font-size="18" font-weight="700" fill="#243B45" text-anchor="middle">3-4 yaş</text>

    <!-- Gülen Yüzler - teal -->
    <circle cx="236" cy="0" r="42" fill="#0E8478"/>
    <circle cx="223" cy="-6" r="5" fill="#fff"/>
    <circle cx="249" cy="-6" r="5" fill="#fff"/>
    <path d="M220 10 Q 236 28 252 10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="236" y="72" font-size="18" font-weight="700" fill="#243B45" text-anchor="middle">5-6 yaş</text>
  </g>
</svg>
